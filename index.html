<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tatami · Cuotas</title>
  <meta name="description" content="Control de cuotas y asistencia para gimnasios de artes marciales">
  <meta name="theme-color" content="#b91c1c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tatami">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Tema elegido en Ajustes (claro u oscuro). Sin elegir, sigue al del sistema.
    try { const t = localStorage.getItem('tatami-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <div>
        <div id="gym-name" class="brand-name">Tatami</div>
        <div class="brand-sub">Demo · datos de ejemplo</div>
      </div>
    </div>
  </header>

  <main id="main"></main>

  <nav id="tabbar" class="tabbar" aria-label="Secciones"></nav>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>Esta app necesita JavaScript activado.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
